// Bloco 1: Define onde o Gradle procura pelas definições dos plugins (online).
// ISTO TEM DE SER O PRIMEIRO BLOCO NO FICHEIRO, como o erro exigiu.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Bloco 2: Lê o ficheiro local.properties para encontrar o caminho para o seu Flutter SDK.
// Este código agora está na posição correta, depois do pluginManagement.
def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException("Flutter SDK not found. Define location in local.properties.")
}

// Bloco 3: Aplica o plugin loader do Flutter usando o método antigo e estável.
// A razão pela qual isto vai funcionar agora é que a ordem do ficheiro está correta.
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"

// Bloco 4: Inclui o módulo principal do seu aplicativo.
include ':app'